name: Bug report
description: Something does not work as the README says it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not post secrets, tokens or private data. For a security problem, follow the [security policy](https://github.com/CompleteTech-LLC-AI-Research/.github/blob/main/SECURITY.md) instead of filing an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got. Include exact error text.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest set of commands or steps that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag or commit hash you ran.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, language runtime and, where relevant, the agent harness and its version.
  - type: textarea
    id: not-tested
    attributes:
      label: What you did not check
      description: Anything you could not run or verify, so we know the limits of this report.
